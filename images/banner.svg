<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="100%" height="100%">
  <!-- Definitions for gradients and patterns -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    
    <!-- Text Gradient: Emerald to Blue-Cyan -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Faint Hexagon Pattern representing Hexagonal Architecture -->
    <pattern id="hex-pattern" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 L 40 57.735 L 20 46.188 Z" 
            fill="none" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="830" height="260" rx="16" fill="url(#bg-grad)" />

  <!-- Hexagonal Pattern Background -->
  <rect width="830" height="260" rx="16" fill="url(#hex-pattern)" />

  <!-- Subtle Glowing Orbs -->
  <circle cx="120" cy="60" r="140" fill="#10b981" opacity="0.04" filter="url(#glow)" />
  <circle cx="700" cy="160" r="120" fill="#3b82f6" opacity="0.04" filter="url(#glow)" />

  <!-- Card Border -->
  <rect x="1" y="1" width="828" height="258" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Left Column - Text Content -->
  <g transform="translate(45, 45)">
    <!-- Sub-badge: Architect & Polyglot -->
    <g transform="translate(0, 0)">
      <rect width="155" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.7" stroke-opacity="0.3" />
      <text x="12" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#10b981" letter-spacing="1">ARCHITECT</text>
      <line x1="90" y1="0" x2="90" y2="22" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />
      <text x="101" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#06b6d4" letter-spacing="1">POLYGLOT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">Hieu Nguyen</text>

    <!-- Subtitle -->
    <text x="0" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#9ca3af">Software Architect &amp; Polyglot Engineer</text>

    <!-- Tagline / Focus Areas -->
    <g transform="translate(0, 118)">
      <!-- Item 1: Hexagonal -->
      <g transform="translate(0, 0)">
        <polygon points="12,1 23,7 23,20 12,26 1,20 1,7" fill="none" stroke="#10b981" stroke-width="1.5" filter="url(#glow-subtle)" />
        <text x="32" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">Hexagonal Architecture</text>
      </g>
      
      <!-- Item 2: Clean Code -->
      <g transform="translate(195, 0)">
        <polygon points="12,1 23,7 23,20 12,26 1,20 1,7" fill="none" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow-subtle)" />
        <text x="32" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">Clean Code Principles</text>
      </g>

      <!-- Item 3: Agentic AI -->
      <g transform="translate(365, 0)">
        <polygon points="12,1 23,7 23,20 12,26 1,20 1,7" fill="none" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow-subtle)" />
        <text x="32" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">Agentic AI Workflows</text>
      </g>
    </g>

    <!-- Core Stacks Badge Row -->
    <g transform="translate(0, 168)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#6b7280" letter-spacing="1.5">CORE STACKS</text>
      <g transform="translate(100, 0)">
        <!-- Kotlin -->
        <rect x="0" y="0" width="60" height="22" rx="5" fill="#1e1b4b" fill-opacity="0.6" stroke="#7f52ff" stroke-width="1" />
        <text x="30" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e0e7ff">Kotlin</text>
        
        <!-- Java -->
        <rect x="68" y="0" width="55" height="22" rx="5" fill="#2d1900" fill-opacity="0.6" stroke="#f89820" stroke-width="1" />
        <text x="95" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffedd5">Java</text>
        
        <!-- C# -->
        <rect x="131" y="0" width="45" height="22" rx="5" fill="#1b003a" fill-opacity="0.6" stroke="#a07cff" stroke-width="1" />
        <text x="153" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f3e8ff">C#</text>
        
        <!-- Swift -->
        <rect x="184" y="0" width="55" height="22" rx="5" fill="#3b0f08" fill-opacity="0.6" stroke="#f05138" stroke-width="1" />
        <text x="211" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fee2e2">Swift</text>
        
        <!-- TypeScript -->
        <rect x="247" y="0" width="85" height="22" rx="5" fill="#0c1d3a" fill-opacity="0.6" stroke="#3178c6" stroke-width="1" />
        <text x="289" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">TypeScript</text>
      </g>
    </g>
  </g>

  <!-- Right Column - Visual Abstract Architecture Artwork -->
  <g transform="translate(685, 130)">
    <!-- Glowing background glow for the architecture graphic -->
    <circle cx="0" cy="0" r="55" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

    <!-- Outer Hexagon (Adapters/Infrastructure) -->
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.35" filter="url(#glow-subtle)" />
    <text x="0" y="-82" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#3b82f6" text-anchor="middle" letter-spacing="0.5">INFRASTRUCTURE</text>
    
    <!-- Middle Hexagon (Application/Ports) -->
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" filter="url(#glow)" />
    <text x="0" y="-55" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="0.5">APPLICATION</text>
    
    <!-- Inner Hexagon (Domain Model) -->
    <polygon points="0,-25 21,-12 21,12 0,25 -21,12 -21,-12" fill="#070a13" stroke="#8b5cf6" stroke-width="2.5" opacity="0.9" />
    
    <!-- Central glowing core -->
    <circle cx="0" cy="0" r="5" fill="#8b5cf6" filter="url(#glow)" />
    
    <!-- Connection lines (Architectural Ports/Adapters) -->
    <line x1="0" y1="-25" x2="0" y2="-75" stroke="#3b82f6" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3" />
    <line x1="0" y1="25" x2="0" y2="75" stroke="#3b82f6" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3" />
    <line x1="21" y1="12" x2="65" y2="37" stroke="#10b981" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3" />
    <line x1="-21" y1="12" x2="-65" y2="37" stroke="#10b981" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3" />
    <line x1="21" y1="-12" x2="65" y2="-37" stroke="#8b5cf6" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3" />
    <line x1="-21" y1="-12" x2="-65" y2="-37" stroke="#8b5cf6" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3" />

    <!-- Outer Nodes (External Systems) -->
    <circle cx="65" cy="37" r="4" fill="#3b82f6" filter="url(#glow-subtle)" />
    <circle cx="-65" cy="-37" r="4" fill="#8b5cf6" filter="url(#glow-subtle)" />
    <circle cx="0" cy="-75" r="4" fill="#3b82f6" filter="url(#glow-subtle)" />

    <!-- Core Label -->
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DOMAIN</text>
  </g>
</svg>
